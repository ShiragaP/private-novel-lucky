version: '3.8'

services:
  novel-postgres:
    image: postgres:16-alpine
    container_name: novel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-novel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_strong_password_here_SEP2026}
      POSTGRES_DB: ${POSTGRES_DB:-novel_db}
    ports:
      - "21042:5432"
    volumes:
      - novel_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-novel} -d $${POSTGRES_DB:-novel_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - novel-network

  novel-reader:
    build: .
    container_name: novel-reader
    restart: unless-stopped
    ports:
      - "${PORT:-21041}:21041"
    environment:
      PORT: ${PORT:-21041}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-novel}:${POSTGRES_PASSWORD:-your_strong_password_here_SEP2026}@novel-postgres:5432/${POSTGRES_DB:-novel_db}}
    depends_on:
      novel-postgres:
        condition: service_healthy
    volumes:
      - ./novels:/app/novels
      - ./cache:/app/cache
      - ./ผมเป็นเจ้าของโรงพยาบาลจิตเวชพิศวง:/app/ผมเป็นเจ้าของโรงพยาบาลจิตเวชพิศวง
    networks:
      - novel-network

networks:
  novel-network:
    driver: bridge

volumes:
  novel_postgres_data:
