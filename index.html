<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=ผมเป็นเจ้าของโรงพยาบาลจิตเวชพิศวง/index.html">
    <title>คลังนิยายออฟไลน์ - Offline Novel Reader</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            color: #2d3748;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            max-width: 480px;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 12px;
        }
        p {
            color: #718096;
            margin-bottom: 20px;
        }
        a {
            display: inline-block;
            background: #3182ce;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
        }
        a:hover {
            background: #2b6cb0;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>📚 คลังนิยายออฟไลน์</h1>
        <p>กำลังนำท่านไปยังหน้านิยาย...</p>
        <a href="ผมเป็นเจ้าของโรงพยาบาลจิตเวชพิศวง/index.html">เข้าสู่หน้าสารบัญ</a>
    </div>
</body>
</html>
